<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Catálogo</h1>

    <center>
        <form id="form-pesquisa">

            <label for="pesquisa">
                Pesquisa por produto
            </label>

            <input 
                type="text" 
                id="pesquisa" 
                placeholder="Digite notebook, mouse ou teclado"
            >

            <button type="submit">
                Pesquisar
            </button>

        </form>
    </center>

    <div id="catalogo"></div>

    <script src="array.js"></script>

</body>

</html>
